<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitCoach AI — Login</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f3f0;
            color: #1a1a1a;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== LOGIN WRAPPER ===== */
        .login-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            background: #ffffff;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08);
        }

        /* ===== LEFT SIDE ===== */
        .login-left {
            background: #1b1b1b;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-left-content {
            color: #ffffff;
        }

        .login-left-content .badge-premium {
            background: rgba(201, 168, 108, 0.15);
            border: 1px solid #c9a86c;
            color: #e4d3b0;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            display: inline-block;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .login-left-content h1 {
            font-size: 4.2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.05;
        }

        .login-left-content p {
            opacity: 0.7;
            font-size: 1.2rem;
            max-width: 360px;
            margin-top: 20px;
        }

        .login-left-content .gold-line {
            display: flex;
            gap: 16px;
            margin-top: 40px;
        }

        .login-left-content .gold-line .line-1 {
            width: 60px;
            height: 4px;
            background: #c9a86c;
            border-radius: 10px;
        }

        .login-left-content .gold-line .line-2 {
            width: 30px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        /* ===== RIGHT SIDE ===== */
        .login-right {
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 30px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
        }

        .login-card .logo {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 28px;
        }

        .login-card .logo span {
            color: #1e7b5a;
        }

        .login-card .heading {
            font-weight: 700;
            font-size: 2rem;
        }

        .login-card .sub-heading {
            color: #6b6b6b;
            margin-bottom: 28px;
        }

        /* ===== FORM ELEMENTS ===== */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            color: #3a3a3a;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #e0ddd8;
            border-radius: 18px;
            font-size: 1rem;
            background: #fafaf8;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1e7b5a;
            box-shadow: 0 0 0 4px rgba(30, 123, 90, 0.10);
        }

        /* ===== BUTTONS ===== */
        .btn-emerald {
            background: #1e7b5a;
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: inline-block;
            text-align: center;
            width: 100%;
        }

        .btn-emerald:hover {
            background: #2a9d7c;
        }

        /* ===== REMEMBER ME ===== */
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0 24px;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #3a3a3a;
            font-weight: 400;
        }

        .remember-forgot a {
            color: #888888;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .remember-forgot a:hover {
            color: #1e7b5a;
        }

        /* ===== SIGN UP LINK ===== */
        .signup-link {
            color: #1e7b5a;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .login-left-content h1 {
                font-size: 3.2rem;
            }
        }

        @media (max-width: 768px) {
            .login-wrapper {
                grid-template-columns: 1fr;
                min-height: 100vh;
            }

            .login-left {
                display: none;
            }

            .login-right {
                padding: 30px 20px;
                min-height: 100vh;
                align-items: center;
            }

            .login-card {
                max-width: 100%;
                padding: 0 10px;
            }

            .login-card .heading {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            .login-right {
                padding: 20px 16px;
            }

            .login-card .logo {
                font-size: 1.6rem;
            }

            .form-group input {
                padding: 12px 16px;
            }

            .btn-emerald {
                padding: 12px 24px;
            }
        }
    </style>
</head>

<body>

    <!-- ============================================================ -->
    <!-- LOGIN PAGE ONLY                                              -->
    <!-- ============================================================ -->
    <div class="login-wrapper">

        <!-- ===== LEFT SIDE ===== -->
        <div class="login-left">
            <div class="login-left-content">
                <div class="badge-premium">
                    <i class="fas fa-microchip"></i> AI POWERED FITNESS
                </div>
                <h1>BUILD YOUR<br>BEST SELF</h1>
                <p>Train smarter. Live stronger. Stay consistent.</p>
                <div class="gold-line">
                    <div class="line-1"></div>
                    <div class="line-2"></div>
                </div>
            </div>
        </div>

        <!-- ===== RIGHT SIDE ===== -->
        <div class="login-right">

            <div class="login-card">

                <!-- ===== LOGO ===== -->
                <div class="logo">FitCoach <span>AI</span></div>

                <!-- ===== LOGIN FORM ===== -->
                <h2 class="heading">Welcome Back</h2>
                <p class="sub-heading">Continue your journey toward a stronger, healthier you.</p>

                <!-- Name / Username -->
                <div class="form-group">
                    <label for="loginName">Full Name or Username</label>
                    <input type="text" id="loginName" placeholder="Alex Johnson">
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="name@example.com">
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="loginConfirmPassword">Confirm Password</label>
                    <input type="password" id="loginConfirmPassword" placeholder="••••••••">
                </div>

                <!-- Age -->
                <div class="form-group">
                    <label for="loginAge">Age</label>
                    <input type="number" id="loginAge" placeholder="32">
                </div>

                <!-- Gender -->
                <div class="form-group">
                    <label for="loginGender">Gender</label>
                    <select id="loginGender"
                        style="width:100%; padding:14px 18px; border:1px solid #e0ddd8; border-radius:18px; font-size:1rem; background:#fafaf8; font-family:inherit;">
                        <option value="" selected disabled>Select Gender`</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Height & Weight in one row -->
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
                    <div class="form-group">
                        <label for="loginHeight">Height (cm)</label>
                        <input type="number" id="loginHeight" placeholder="175">
                    </div>
                    <div class="form-group">
                        <label for="loginWeight">Weight (kg)</label>
                        <input type="number" id="loginWeight" placeholder="70">
                    </div>
                </div>

                <!-- Fitness Goal -->
                <div class="form-group">
                    <label for="loginGoal">Fitness Goal</label>
                    <select id="loginGoal"
                        style="width:100%; padding:14px 18px; border:1px solid #e0ddd8; border-radius:18px; font-size:1rem; background:#fafaf8; font-family:inherit;">
                        <option value="weight-loss">Weight Loss</option>
                        <option value="muscle-gain">Muscle Gain</option>
                        <option value="maintain">Maintain Weight</option>
                        <option value="improve-fitness" selected>Improve Fitness</option>
                    </select>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="remember-forgot">
                    <label>
                        <input type="checkbox" id="rememberMe" value="Remember me"> Remember me
                    </label>
                    <a href="#" id="forgotPassword">Forgot password?</a>
                </div>

                <!-- Login Button -->
                <button class="btn-emerald" id="loginBtn" type="submit">Log In</button>

                <!-- Sign Up Link -->
                <div class="login-footer">
                    Already have an account?
                    <a href="./index.html" class="signup-link">Sign In</a>
                </div>

            </div><!-- /.login-card -->

        </div><!-- /.login-right -->

    </div><!-- /.login-wrapper -->

    <script src="login.js"></script>

</body>

</html>
